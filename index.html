<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KALKAL</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0a] text-white">

<div id="app"></div>

<script>
// DITO MO PAPALITAN MGA DRAMA
const DRAMAS = [
  { id: 1, title: "Ang Lihim ng Asawa Kong CEO", ep: 100, views: "2.1M", tag: "CEO", color: "from-purple-600 to-pink-600", desc: "CEO pala asawa niya!" },
  { id: 2, title: "Binalikan ng Ex na Bilyonaryo", ep: 80, views: "1.8M", tag: "Ganti", color: "from-red-600 to-orange-600", desc: "Bumalik na bilyonaryo" },
  { id: 3, title: "Kasambahay, Naging Reyna", ep: 120, views: "3.4M", tag: "Drama", color: "from-emerald-600 to-teal-600", desc: "Mula kasambahay to reyna" },
  { id: 4, title: "Pinagpalit sa Pera", ep: 60, views: "900K", tag: "Iyakan", color: "from-blue-600 to-indigo-600", desc: "Pinili pera" },
  { id: 5, title: "Ang Paghihiganti ni Luna", ep: 90, views: "2.7M", tag: "Ganti", color: "from-zinc-700 to-zinc-900", desc: "Tahimik dati" },
];

let selected = null;
let curEp = 1;
let cat = "Lahat";
let liked = false;

function render() {
  const root = document.getElementById('app');

  // PLAYER VIEW
  if (selected) {
    const d = selected;
    const locked = curEp > 5; // 5 libre lang - palitan mo dito
    root.innerHTML = `
      <div class="max-w-[420px] mx-auto min-h-screen p-4">
        <div class="flex justify-between text-sm">
          <button onclick="back()">← Back</button>
          <span>Ep ${curEp}/${d.ep}</span>
        </div>
        <div class="mt-4 aspect-[9/16] rounded-2xl bg-gradient-to-br ${d.color} flex flex-col items-center justify-center p-6 text-center">
          ${locked? `
            <h2 class="text-xl font-bold">🔒 Locked</h2>
            <p class="text-sm mt-2">I-unlock sa P99</p>
            <button class="mt-4 bg-white text-black px-6 py-2 rounded-full font-bold">I-unlock</button>
          ` : `
            <div class="text-6xl">▶</div>
            <p class="mt-4 font-bold">Episode ${curEp}</p>
            <p class="text-sm opacity-80">${d.title}</p>
          `}
        </div>
        <div class="flex justify-around mt-4">
          <button onclick="toggleLike()" class="bg-zinc-800 px-4 py-2 rounded-full text-sm">${liked? '❤️' : '🤍'} Like</button>
          <button onclick="nextEp()" class="bg-zinc-800 px-4 py-2 rounded-full text-sm">⏭️ Next</button>
        </div>
        <h4 class="mt-6 font-bold">Episodes</h4>
        <div class="grid grid-cols-5 gap-2 mt-2">
          ${Array.from({length: d.ep}, (_, i) => i+1).map(ep => `
            <button onclick="goEp(${ep})" class="py-3 rounded-lg text-sm ${ep===curEp? 'bg-white text-black' : 'bg-zinc-800'} ${ep>5? 'opacity-40' : ''}">${ep}</button>
          `).join('')}
        </div>
      </div>
    `;
    return;
  }

  // FEED VIEW
  const filtered = cat === "Lahat"? DRAMAS : DRAMAS.filter(x => x.tag === cat);
  root.innerHTML = `
    <div class="max-w-[420px] mx-auto min-h-screen pb-20">
      <header class="p-4 border-b border-zinc-800">
        <h1 class="text-3xl font-black">KALKAL</h1>
        <p class="text-xs opacity-60">Kalkal ng Drama</p>
      </header>
      <div class="flex gap-2 p-3 overflow-x-auto">
        ${["Lahat","CEO","Ganti","Drama","Iyakan"].map(c => `
          <button onclick="setCat('${c}')" class="px-4 py-1.5 rounded-full text-sm whitespace-nowrap ${cat===c? 'bg-white text-black' : 'bg-zinc-800'}">${c}</button>
        `).join('')}
      </div>
      <div class="mx-4 bg-gradient-to-r from-amber-500 to-red-500 rounded-xl p-3 text-xs font-bold">👑 KALKAL Premium P99 - Unlock lahat</div>
      <div class="grid grid-cols-2 gap-3 p-4">
        ${filtered.map(d => `
          <div onclick="openDrama(${d.id})" class="cursor-pointer">
            <div class="aspect-[9/16] rounded-2xl bg-gradient-to-br ${d.color} p-3 relative flex flex-col justify-end">
              <span class="absolute top-2 left-2 bg-black/60 text-[10px] px-2 py-1 rounded">${d.ep} EP</span>
              <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-3xl">▶</span>
              <h3 class="text-xs font-bold">${d.title}</h3>
            </div>
            <p class="text-xs font-semibold mt-1 truncate">${d.title}</p>
            <p class="text-[10px] opacity-50">${d.views} views</p>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function openDrama(id){ selected = DRAMAS.find(x=>x.id===id); curEp=1; render(); }
function back(){ selected=null; render(); }
function nextEp(){ if(curEp < selected.ep) curEp++; render(); }
function goEp(ep){ curEp=ep; render(); }
function setCat(c){ cat=c; render(); }
function toggleLike(){ liked=!liked; render(); }

render();
</script>
</body>
</html>
